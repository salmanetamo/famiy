openapi: 3.1.0
info:
  title: Family Graph API
  version: 0.1.0
  description: >
    Phase 4 vertical slice. Hand-maintained and documentation-only (no codegen);
    the integration tests in internal/app are the executable contract.
    No authentication yet (undecided, see docs/03).
servers:
  - url: http://localhost:8080
    description: Local development

# Explicitly unauthenticated for now. Replace with a securitySchemes entry and a
# real requirement once the authentication approach is decided (docs/03).
security: []

paths:
  /healthz:
    get:
      summary: Liveness and database connectivity
      operationId: healthz
      responses:
        "200":
          description: Service and database are up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { status: ok, db: up }
        "503":
          description: Database unreachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { status: unavailable, db: down }

  /persons:
    post:
      summary: Create a person
      operationId: createPerson
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePerson" }
            example:
              given_name: Ada
              family_name: Lovelace
              birth_date: "1815-12-10"
              birth_approx: false
              death_date: "1852-11-27"
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: URL of the new person
              schema: { type: string, example: /persons/1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "400":
          description: >
            Malformed JSON or unknown field (invalid_json), or a rule violated
            (validation_failed).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { code: validation_failed, message: given_name is required }

  /persons/{id}:
    get:
      summary: Fetch a person
      operationId: getPerson
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "200":
          description: The person
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "400":
          $ref: "#/components/responses/InvalidId"
        "404":
          $ref: "#/components/responses/PersonNotFound"

  /persons/{id}/ancestors:
    get:
      summary: All ancestors of a person
      description: >
        Walks parent links upward with a recursive CTE. Each ancestor appears
        once, at its shortest generational distance (parent = 1). Ordered by
        generations, then id. Returns an empty list for a person with no known parents.
      operationId: getAncestors
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "200":
          description: Ancestors, nearest generation first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ancestors" }
              example:
                person_id: 3
                ancestors:
                  - { person_id: 2, generations: 1 }
                  - { person_id: 1, generations: 2 }
        "400":
          $ref: "#/components/responses/InvalidId"
        "404":
          $ref: "#/components/responses/PersonNotFound"

components:
  parameters:
    PersonId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }

  responses:
    InvalidId:
      description: id is not a positive integer (invalid_id)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { code: invalid_id, message: id must be a positive integer }
    PersonNotFound:
      description: No such person (person_not_found)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { code: person_not_found, message: person not found }

  schemas:
    Health:
      type: object
      required: [status, db]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        db: { type: string, enum: [up, down] }

    CreatePerson:
      type: object
      additionalProperties: false
      required: [given_name]
      properties:
        given_name: { type: string, description: Required; surrounding whitespace is trimmed }
        family_name: { type: [string, "null"] }
        birth_date: { type: [string, "null"], format: date }
        birth_approx:
          type: boolean
          default: false
          description: Birth date is approximate. Requires birth_date.
        death_date:
          type: [string, "null"]
          format: date
          description: Must not be before birth_date

    Person:
      type: object
      required: [id, given_name, family_name, birth_date, birth_approx, death_date, created_at]
      properties:
        id: { type: integer, format: int64 }
        given_name: { type: string }
        family_name: { type: [string, "null"] }
        birth_date: { type: [string, "null"], format: date }
        birth_approx: { type: boolean }
        death_date: { type: [string, "null"], format: date }
        created_at: { type: string, format: date-time }

    Ancestors:
      type: object
      required: [person_id, ancestors]
      properties:
        person_id: { type: integer, format: int64 }
        ancestors:
          type: array
          items:
            type: object
            required: [person_id, generations]
            properties:
              person_id: { type: integer, format: int64 }
              generations: { type: integer, minimum: 1 }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: Stable machine-readable code }
            message: { type: string }
