openapi: 3.1.0
info:
  title: Family Graph API
  version: 0.1.0
  description: >
    Phase 4 foundation plus the Phase 5 read model (in progress). Hand-maintained and documentation-only (no codegen);
    the integration tests in internal/app are the executable contract.
    Cookie-session authentication (ADR-004): sign in with /auth/register or /auth/login, which
    set an HttpOnly session cookie. A person that belongs to another account is reported as 404,
    exactly like one that does not exist. State-changing requests must send
    Content-Type: application/json and, from a browser, a same-origin (or allow-listed) Origin.
    Every response carries an X-Request-Id header; quote it when reporting a problem.
servers:
  - url: http://localhost:8080
    description: Local development

# Everything requires a session unless an operation says `security: []`.
security:
  - cookieAuth: []

paths:
  /healthz:
    get:
      summary: Liveness and database connectivity
      operationId: healthz
      security: []
      responses:
        "200":
          description: Service and database are up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { status: ok, db: up }
        "503":
          description: Database unreachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { status: unavailable, db: down }

  /auth/register:
    post:
      summary: Create an account and sign in
      description: >
        Closed (403 registration_closed) when REGISTRATION_ENABLED is off or MAX_USERS accounts
        already exist. Email is trimmed and lower-cased. Password: 12 to 128 characters.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "201":
          description: Account created; the session cookie is set
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400":
          description: Invalid JSON, email or password (invalid_json, validation_failed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Registration is closed (registration_closed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Email already registered (email_taken)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: >
            More than 10 registration attempts from this address within an hour, valid or not
            (too_many_registrations)
          headers:
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/login:
    post:
      summary: Sign in
      description: >
        Wrong password, unknown email and malformed email all return the same 401. Every
        attempt counts as it starts: after 5 for one email and address (or 30 for one address)
        within 15 minutes, further attempts return 429 until the window ends, even with the
        right password. A successful login gives its attempt back. IPv6 clients are limited by /64.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: Signed in; the session cookie is set
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          description: Credentials rejected (invalid_credentials)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many failed attempts (too_many_attempts)
          headers:
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/logout:
    post:
      summary: End the current session
      description: Always 204, even without a valid session; the cookie is cleared.
      operationId: logout
      security: []
      responses:
        "204":
          description: Signed out

  /auth/me:
    get:
      summary: The signed-in account
      operationId: me
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /persons:
    get:
      summary: Search your people by name
      description: >
        Returns the caller's people whose name contains every word of q, case-insensitively
        (not accent-insensitively: "Zoe" does not match "Zoë"). q is split on whitespace; %, _
        and \ are ordinary characters. Results are ordered by family name (people without one last), given name, id.
        There is no paging: use limit and has_more. To list everyone use GET /graph.
      operationId: searchPersons
      parameters:
        - name: q
          in: query
          required: true
          description: 1 to 100 characters after trimming, at most 5 words
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Matching people (possibly none)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResult" }
              example:
                persons:
                  - { id: 1, given_name: Ada, family_name: Lovelace, birth_date: "1815-12-10", birth_approx: false, death_date: "1852-11-27" }
                has_more: false
        "400":
          description: >
            q missing, blank, over 100 characters or over 5 words; limit not an integer or outside 1..50
            (validation_failed). An over-large limit is rejected, not clamped.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { code: validation_failed, message: q is required }
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      summary: Create a person
      operationId: createPerson
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePerson" }
            example:
              given_name: Ada
              family_name: Lovelace
              birth_date: "1815-12-10"
              birth_approx: false
              death_date: "1852-11-27"
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: URL of the new person
              schema: { type: string, example: /persons/1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "400":
          description: >
            Malformed JSON, an unknown field, a wrongly typed field or trailing data
            after the JSON value (invalid_json), or a rule violated (validation_failed):
            blank or over-long name, dates outside 1000-01-01 .. today, death before
            birth, birth_approx without birth_date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { code: validation_failed, message: given_name is required }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          description: >
            The account already owns the maximum number of people (person_limit_reached;
            MAX_PERSONS_PER_ACCOUNT, default 10000)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { code: person_limit_reached, message: this account has reached its limit on the number of people }
        "413":
          description: Request body larger than 1 MiB (request_too_large)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { code: request_too_large, message: "request body exceeds 1048576 bytes" }

  /persons/{id}:
    get:
      summary: Fetch a person
      operationId: getPerson
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "200":
          description: The person
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/PersonNotFound"
    patch:
      summary: Update a person
      description: >
        JSON Merge Patch semantics (RFC 7396), sent as application/json: a key that is absent
        leaves the field unchanged, null clears it, a value replaces it. family_name, birth_date
        and death_date can be cleared; given_name and birth_approx cannot (null is a 400). A
        blank family_name clears it, as on create. The merged result is validated with the same
        rules as create, so rules that span fields apply to the result: clearing birth_date while
        birth_approx is true is refused unless the same request sets birth_approx to false, and
        death_date must not end up before birth_date. id, created_at and ownership cannot be
        patched (unknown field). An empty object is a no-op and returns the person. Concurrent
        updates are applied one after the other, so changes to different fields are all kept.
      operationId: updatePerson
      parameters:
        - $ref: "#/components/parameters/PersonId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchPerson" }
            example:
              family_name: null
              death_date: "1852-11-27"
      responses:
        "200":
          description: The person after the update
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "400":
          description: >
            Malformed JSON, an unknown or wrongly typed field (invalid_json), a rule violated
            (validation_failed), or id is not a positive integer (invalid_id).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { code: validation_failed, message: birth_approx requires birth_date }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/PersonNotFound"
        "413":
          description: Request body larger than 1 MiB (request_too_large)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { code: request_too_large, message: "request body exceeds 1048576 bytes" }
    delete:
      summary: Delete a person permanently
      description: >
        Irreversible. The person is removed together with every parent link they are part of
        (as parent and as child) and every partnership they are in. Their children and partners
        are kept; a child simply has one parent fewer. The person no longer counts towards
        MAX_PERSONS_PER_ACCOUNT. Clients should refetch GET /graph afterwards.
      operationId: deletePerson
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/PersonNotFound"

  /persons/{id}/ancestors:
    get:
      summary: All ancestors of a person
      description: >
        Walks parent links upward with a recursive CTE. Each ancestor appears
        once, at its shortest generational distance (parent = 1). Ordered by
        generations, then id. Returns an empty list for a person with no known parents.
      operationId: getAncestors
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "200":
          description: Ancestors, nearest generation first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ancestors" }
              example:
                person_id: 3
                ancestors:
                  - { person_id: 2, generations: 1 }
                  - { person_id: 1, generations: 2 }
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/PersonNotFound"

  /persons/{id}/parents:
    post:
      summary: Add a parent to a person
      description: >
        Links the person in the path (the child) to an existing person (the parent). Both must
        belong to the signed-in account; a person that is missing or belongs to someone else
        is reported identically (404 person_not_found). A person has at most two parents, a
        link cannot be repeated, and no link may make a person their own ancestor. There is no
        Location header: a link has no URL of its own. Read parents back with
        GET /persons/{id}/ancestors (generations = 1).
      operationId: addParent
      parameters:
        - $ref: "#/components/parameters/PersonId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddParent" }
            example: { parent_id: 7 }
      responses:
        "201":
          description: The link was created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentLink" }
              example: { child_id: 9, parent_id: 7 }
        "400":
          description: >
            Bad id (invalid_id), malformed body or wrong type (invalid_json), parent_id missing
            or not positive (validation_failed), or a person named as their own parent
            (self_parent)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/PersonNotFound"
        "409":
          description: >
            The child already has two parents (too_many_parents), the link already exists
            (duplicate_parent), or the parent is already a descendant of the child
            (would_create_cycle)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { code: would_create_cycle, message: this parent link would make a person their own ancestor }

  /persons/{id}/parents/{parentId}:
    delete:
      summary: Remove a parent from a person
      description: >
        Deletes the link between the person in the path (the child) and one of their parents. Both
        must belong to the signed-in account; a person that is missing or belongs to someone else
        is reported identically (404 person_not_found). If both are yours but are not linked, the
        answer is 404 parent_link_not_found, so a repeated DELETE is not silently accepted.
        Removing a link frees one of the child's two parent slots.
      operationId: removeParent
      parameters:
        - $ref: "#/components/parameters/PersonId"
        - $ref: "#/components/parameters/ParentId"
      responses:
        "204":
          description: The link was removed
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: >
            A person does not exist or is not yours (person_not_found), or they are not linked
            (parent_link_not_found)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { code: parent_link_not_found, message: that person is not a parent of this person }

  /graph:
    get:
      summary: The whole family graph of the account
      description: >
        Everything the caller owns in one consistent snapshot: people, parent links and
        partnerships. This is what a client lays out and renders. Nodes carry only the fields
        layout needs (no created_at, bio or residence; fetch those per person). Persons are
        ordered by id, links by (parent_id, child_id), partnerships by their stored pair.
        An account with no data gets three empty arrays. The size is bounded by
        MAX_PERSONS_PER_ACCOUNT. Measured locally with synthetic data: 1,000 people (1,498
        links, 400 partnerships) is 189 KB of JSON, about 17 KB gzipped; 10,000 people is
        1.94 MB, about 163 KB gzipped. The server does not compress; the reverse proxy should.
        The response is Cache-Control: no-store like every other.
      operationId: getGraph
      responses:
        "200":
          description: The graph
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Graph" }
              example:
                persons:
                  - { id: 1, given_name: Ada, family_name: Lovelace, birth_date: "1815-12-10", birth_approx: false, death_date: "1852-11-27" }
                  - { id: 2, given_name: Byron, family_name: null, birth_date: null, birth_approx: false, death_date: null }
                parent_links:
                  - { parent_id: 1, child_id: 2 }
                partnerships: []
        "401":
          $ref: "#/components/responses/Unauthenticated"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-famiy_session
      description: >
        Opaque session token set by /auth/register and /auth/login. The cookie is named
        famiy_session (no prefix) only when the server runs with COOKIE_SECURE=false for
        plain-HTTP local development; browsers reject the __Host- prefix on non-Secure cookies.

  headers:
    RetryAfter:
      description: Seconds to wait before retrying
      schema: { type: integer, example: 900 }
    SessionCookie:
      description: >
        __Host-famiy_session=<token>; HttpOnly; SameSite=Lax; Path=/; Expires=...; Secure (the
        __Host- prefix and Secure are dropped only when COOKIE_SECURE=false for plain-HTTP local
        development).
      schema: { type: string }

  parameters:
    ParentId:
      name: parentId
      in: path
      required: true
      description: The id of the parent whose link is removed
      schema: { type: integer, format: int64, minimum: 1 }

    PersonId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }

  responses:
    Unauthenticated:
      description: No valid session (unauthenticated)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { code: unauthenticated, message: authentication required }
    InvalidId:
      description: id is not a positive integer (invalid_id)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { code: invalid_id, message: id must be a positive integer }
    PersonNotFound:
      description: >
        No such person, or it belongs to another account (person_not_found). The two cases are
        deliberately indistinguishable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { code: person_not_found, message: person not found }

  schemas:
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, maxLength: 254, description: ASCII only }
        password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }

    User:
      type: object
      required: [id, email, created_at]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        created_at: { type: string, format: date-time }

    Health:
      type: object
      required: [status, db]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        db: { type: string, enum: [up, down] }

    CreatePerson:
      type: object
      additionalProperties: false
      required: [given_name]
      properties:
        given_name: { type: string, maxLength: 200, description: Required; surrounding whitespace is trimmed }
        family_name: { type: [string, "null"], maxLength: 200 }
        birth_date: { type: [string, "null"], format: date, description: "Between 1000-01-01 and today" }
        birth_approx:
          type: boolean
          default: false
          description: Birth date is approximate. Requires birth_date.
        death_date:
          type: [string, "null"]
          format: date
          description: Must not be before birth_date

    PatchPerson:
      type: object
      additionalProperties: false
      description: Every property is optional; absent means unchanged
      properties:
        given_name: { type: string, maxLength: 200, description: "Cannot be null; surrounding whitespace is trimmed" }
        family_name: { type: [string, "null"], maxLength: 200, description: null or blank clears it }
        birth_date: { type: [string, "null"], format: date, description: "null clears it. Between 1000-01-01 and today" }
        birth_approx: { type: boolean, description: "Cannot be null. true requires a birth_date after the merge" }
        death_date: { type: [string, "null"], format: date, description: "null clears it. Must not be before birth_date" }

    Person:
      type: object
      required: [id, given_name, family_name, birth_date, birth_approx, death_date, created_at]
      properties:
        id: { type: integer, format: int64 }
        given_name: { type: string }
        family_name: { type: [string, "null"] }
        birth_date: { type: [string, "null"], format: date }
        birth_approx: { type: boolean }
        death_date: { type: [string, "null"], format: date }
        created_at: { type: string, format: date-time }

    PersonSummary:
      description: A person as search and the graph carry them (Person without created_at)
      type: object
      required: [id, given_name, family_name, birth_date, birth_approx, death_date]
      properties:
        id: { type: integer, format: int64 }
        given_name: { type: string }
        family_name: { type: [string, "null"] }
        birth_date: { type: [string, "null"], format: date }
        birth_approx: { type: boolean }
        death_date: { type: [string, "null"], format: date }

    SearchResult:
      type: object
      required: [persons, has_more]
      properties:
        persons:
          type: array
          items: { $ref: "#/components/schemas/PersonSummary" }
        has_more:
          type: boolean
          description: More matches exist beyond limit

    Graph:
      type: object
      required: [persons, parent_links, partnerships]
      properties:
        persons:
          type: array
          items: { $ref: "#/components/schemas/PersonSummary" }
        parent_links:
          type: array
          items:
            type: object
            required: [parent_id, child_id]
            properties:
              parent_id: { type: integer, format: int64 }
              child_id: { type: integer, format: int64 }
        partnerships:
          type: array
          description: Always present; empty until partnerships can be created
          items:
            type: object
            required: [partners, kind]
            properties:
              partners:
                type: array
                description: The two people, in no meaningful order
                minItems: 2
                maxItems: 2
                items: { type: integer, format: int64 }
              kind: { type: string }

    AddParent:
      type: object
      additionalProperties: false
      required: [parent_id]
      properties:
        parent_id: { type: integer, format: int64, minimum: 1 }

    ParentLink:
      type: object
      required: [child_id, parent_id]
      properties:
        child_id: { type: integer, format: int64 }
        parent_id: { type: integer, format: int64 }

    Ancestors:
      type: object
      required: [person_id, ancestors]
      properties:
        person_id: { type: integer, format: int64 }
        ancestors:
          type: array
          items:
            type: object
            required: [person_id, generations]
            properties:
              person_id: { type: integer, format: int64 }
              generations: { type: integer, minimum: 1 }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: Stable machine-readable code }
            message: { type: string }
